<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>iRelay</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="titlebar"><span class="brand-mark"></span><span>iRelay</span><span id="version" class="muted small"></span></div>

  <aside class="sidebar">
    <nav>
      <div class="nav-label">Library</div>
      <button class="nav-item active" data-view="steam"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-9.95 9.1l5.35 2.2a2.8 2.8 0 0 1 1.6-.5h.15l2.4-3.45v-.05a3.8 3.8 0 1 1 3.8 3.8h-.08l-3.4 2.45v.12a2.85 2.85 0 0 1-5.65.5L2.4 14.6A10 10 0 1 0 12 2Z"/></svg>Steam<span class="count" id="count-steam"></span></button>
      <button class="nav-item" data-view="epic"><img class="nav-logo" src="img/epic.png" alt="">Epic Games<span class="count" id="count-epic"></span></button>
      <button class="nav-item" data-view="gog"><img class="nav-logo" src="img/gog.png" alt="">GOG<span class="count" id="count-gog"></span></button>
      <button class="nav-item" data-view="ea"><img class="nav-logo" src="img/ea.png" alt="">EA app<span class="count" id="count-ea"></span></button>
      <div class="nav-label">Activity</div>
      <button class="nav-item" data-view="tasks"><svg viewBox="0 0 24 24"><path d="M12 3v10.6l3.3-3.3 1.4 1.4L12 16.4l-4.7-4.7 1.4-1.4 3.3 3.3V3h0Zm-8 15h16v2H4v-2Z"/></svg>Transfers<span class="count" id="count-tasks"></span></button>
      <div class="nav-label">Bugs</div>
      <button class="nav-item" data-view="bugs-irelay"><svg viewBox="0 0 24 24"><path d="M14.6 3.9 16 2.5l1.4 1.4-1.6 1.6A6 6 0 0 1 18 9h2v2h-2v1h2v2h-2a6 6 0 0 1-12 0H4v-2h2v-1H4V9h2a6 6 0 0 1 2.2-3.5L6.6 3.9 8 2.5l1.4 1.4a6 6 0 0 1 5.2 0ZM11 9v8h2V9h-2Z"/></svg>iRelay bugs<span class="count" id="count-bugs-irelay"></span></button>
      <button class="nav-item" data-view="bugs-ideck"><svg viewBox="0 0 24 24"><path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm0 3v12h10V5H7Zm4 13v2h2v-2h-2Z"/></svg>iDeck bugs<span class="count" id="count-bugs-ideck"></span></button>
      <div class="nav-label">iRelay</div>
      <button class="nav-item" data-view="settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m19.4 13 .1-1-.1-1 2-1.5-2-3.4-2.3 1a8 8 0 0 0-1.7-1L15 3h-4l-.4 3.1a8 8 0 0 0-1.7 1l-2.3-1-2 3.4 2 1.5-.1 1 .1 1-2 1.5 2 3.4 2.3-1a8 8 0 0 0 1.7 1L11 21h4l.4-3.1a8 8 0 0 0 1.7-1l2.3 1 2-3.4-2-1.5ZM13 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z"/></svg>Settings</button>
      <button class="nav-item" data-view="about"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm-1 8v7h2v-7h-2Zm0-3v2h2V7h-2Z"/></svg>About</button>
    </nav>
    <div class="device-box">
      <div class="nav-label">Connected device</div>
      <div class="device" id="device">
        <div class="device-dot" id="device-dot"></div>
        <div class="device-info">
          <div class="device-title" id="device-title">No device</div>
          <div class="device-text" id="device-text">Looking for a connected device…</div>
        </div>
      </div>
      <select id="device-select" class="device-select hidden"></select>
    </div>
  </aside>

  <main>
    <header class="toolbar">
      <h1 id="view-title">Steam</h1>
      <div class="toolbar-right">
        <div class="segmented" id="filter">
          <button data-filter="all" class="active">All</button>
          <button data-filter="pc">Installing</button>
          <button data-filter="ipad">On device</button>
        </div>
        <input id="search" type="search" placeholder="Search" autocomplete="off">
        <button class="icon-button" id="refresh" title="Reload library"><svg viewBox="0 0 24 24"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.8-4.2L13 11h7V4l-2.3 2.3Z"/></svg></button>
      </div>
    </header>
    <section id="content" class="content"></section>
  </main>

  <div id="drawer" class="drawer hidden"></div>

  <div id="gate" class="gate hidden">
    <div class="gate-card">
      <div class="gate-icon"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-9.95 9.1l5.35 2.2a2.8 2.8 0 0 1 1.6-.5h.15l2.4-3.45v-.05a3.8 3.8 0 1 1 3.8 3.8h-.08l-3.4 2.45v.12a2.85 2.85 0 0 1-5.65.5L2.4 14.6A10 10 0 1 0 12 2Z"/></svg></div>
      <h2 id="gate-title">Steam is not running</h2>
      <p id="gate-text">iRelay installs games through the Steam client on this PC. Open Steam and sign in; iRelay continues automatically.</p>
      <button class="primary" id="gate-button">Open Steam</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
