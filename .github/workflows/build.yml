name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Compress-Archive -Path dist/iRelay-win32-x64/* -DestinationPath "dist/iRelay-$version-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: iRelay-win-x64
          path: |
            dist/iRelay-*-win-x64.zip
            dist/app-*.asar
            dist/app-*.asar.sha256
      # A new version in package.json on main becomes a release; running copies
      # of iRelay pick it up the next time they start.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released"
          else
            gh release create "v$VERSION" "dist/iRelay-$VERSION-win-x64.zip" "dist/app-$VERSION.asar" "dist/app-$VERSION.asar.sha256" \
              --title "iRelay $VERSION" --generate-notes
          fi
