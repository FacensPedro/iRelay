name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      # Signed builds (repository secrets WIN_CSC_LINK = base64 .pfx and
      # WIN_CSC_KEY_PASSWORD): a code-signing certificate is what keeps Microsoft
      # Defender and SmartScreen from treating iRelay.exe as unknown. Without the
      # secrets the build is unsigned.
      - name: Build
        shell: bash
        # Not WIN_CSC_LINK: electron-builder reads that name itself, even empty.
        env:
          SIGN_PFX: ${{ secrets.WIN_CSC_LINK }}
          SIGN_PFX_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGN_PFX" ]; then export CSC_LINK="$SIGN_PFX" CSC_KEY_PASSWORD="$SIGN_PFX_PASSWORD"; else export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          npm run build
      # Starts the built iRelay.exe on Windows and fails when it does not open.
      - name: Start test
        shell: pwsh
        run: |
          $exe = Resolve-Path dist/iRelay.exe
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(90000)) { Stop-Process -Id $process.Id -Force; $timedOut = $true }
          $log = Join-Path $env:APPDATA 'iRelay\irelay.log'
          if (Test-Path $log) { Get-Content $log } else { Write-Host 'no log written' }
          if ($timedOut -or -not (Select-String -Path $log -Pattern 'smoke test passed' -Quiet)) { throw 'iRelay did not open' }
      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          # The zip holds only iRelay.exe.
          Compress-Archive -Path dist/iRelay.exe -DestinationPath "dist/iRelay-$version-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: iRelay-win-x64
          path: |
            dist/iRelay-*-win-x64.zip
            dist/app-*.asar
            dist/app-*.asar.sha256
      # A new version in package.json on main becomes a release; running copies
      # of iRelay pick it up the next time they start.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released"
          else
            gh release create "v$VERSION" "dist/iRelay-$VERSION-win-x64.zip" "dist/app-$VERSION.asar" "dist/app-$VERSION.asar.sha256" \
              --title "iRelay $VERSION" --generate-notes
          fi
